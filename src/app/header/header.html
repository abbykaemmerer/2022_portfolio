<header class="site-header">
  <nav class="site-nav" aria-label="Primary">
    <div class="site-nav__cluster site-nav__cluster--start">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >Home</a>
      <a
        routerLink="/portfolio/professional"
        [class.is-active]="portfolioActive()"
        [attr.aria-current]="portfolioActive() ? 'page' : null"
      >Portfolio</a>
    </div>
    <a routerLink="/" class="logo" aria-label="Abby Kaemmerer home">
      <span>A</span>
      <span class="material-symbols-outlined" aria-hidden="true">bolt</span>
      <span>K</span>
    </a>
    <div class="site-nav__cluster site-nav__cluster--end">
      <a routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page">Contact</a>
    </div>
  </nav>
</header>
